{{- if .Values.dashboards.enabled }}
# Grafana dashboards as ConfigMaps for sidecar discovery
# Grafana's sidecar watches for ConfigMaps with the specified label
# and automatically provisions them as dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sie-cluster.fullname" . }}-dashboard-cluster
  namespace: {{ include "sie-cluster.namespace" . }}
  labels:
    {{- include "sie-cluster.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.dashboards.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    grafana_folder: {{ .Values.dashboards.folder | quote }}
data:
  sie-cluster-overview.json: |-
{{ .Files.Get "files/dashboards/cluster-overview.json" | indent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sie-cluster.fullname" . }}-dashboard-model
  namespace: {{ include "sie-cluster.namespace" . }}
  labels:
    {{- include "sie-cluster.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.dashboards.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    grafana_folder: {{ .Values.dashboards.folder | quote }}
data:
  sie-model-performance.json: |-
{{ .Files.Get "files/dashboards/model-performance.json" | indent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sie-cluster.fullname" . }}-dashboard-health
  namespace: {{ include "sie-cluster.namespace" . }}
  labels:
    {{- include "sie-cluster.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.dashboards.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    grafana_folder: {{ .Values.dashboards.folder | quote }}
data:
  sie-worker-health.json: |-
{{ .Files.Get "files/dashboards/worker-health.json" | indent 4 }}
{{- end }}
