# SIE Cluster Helm Values
# Configuration for SIE router and GPU worker pools

# -- Global settings
global:
  # -- Image pull secrets for private registries
  imagePullSecrets: []
  # -- Namespace override (defaults to release namespace)
  namespace: ""

# -- Router configuration
router:
  # -- Number of router replicas (minimum 2 for HA)
  replicas: 2

  image:
    repository: ghcr.io/superlinked/sie-router
    tag: ""  # Defaults to appVersion
    pullPolicy: IfNotPresent

  # -- Resource requests/limits
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

  # -- Service configuration
  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  # -- Pod annotations
  podAnnotations: {}

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity rules
  affinity: {}

  # -- Router auth (static token)
  auth:
    # -- Mode: none | static
    mode: none
    # -- Secret with comma-separated tokens
    tokenSecretName: ""
    tokenSecretKey: "SIE_AUTH_TOKEN"

  # -- Embedded configs: auto-generate ConfigMaps from files/ in chart
  # This is the simplest option for testing, CI, and ephemeral clusters.
  # Configs are baked into the Helm chart and deployed as ConfigMaps.
  # For production with hot-reload, use gitSync instead.
  embeddedConfigs:
    # -- Enable embedded config delivery (auto-generates ConfigMaps from files/bundles and files/models)
    enabled: true

  # -- ConfigMap for static config injection (manual ConfigMap creation)
  # Use this if you want to create ConfigMaps externally and reference them.
  # For most cases, use embeddedConfigs (simpler) or gitSync (production).
  configMap:
    # -- Enable ConfigMap-based config injection (manual)
    enabled: false
    # -- Base name for ConfigMaps (creates {name}-bundles and {name}-models)
    name: "sie-config"
    # -- Override for bundles ConfigMap name
    bundlesConfigMap: ""
    # -- Override for models ConfigMap name
    modelsConfigMap: ""
    # -- Bundle configs to mount (key: ConfigMap key, file: target filename)
    bundles: []
    # Example:
    #   - key: default.yaml
    #     file: default.yaml
    # -- Model configs to mount (key: ConfigMap key, mounted as models/<key>.yaml)
    models: []
    # Example:
    #   - key: all-MiniLM-L6-v2

  # -- Git-sync sidecar for config hot reload (bundles and models)
  gitSync:
    # -- Enable git-sync sidecar for config hot reload
    enabled: false
    # -- Git repository URL (HTTPS or SSH)
    # Examples:
    #   - https://github.com/org/repo (public)
    #   - git@github.com:org/repo (private, requires sshSecret)
    repo: ""
    # -- Branch to sync
    branch: main
    # -- Sync interval (e.g., 60s, 5m)
    period: 60s
    # -- Path within repo to bundles directory
    bundlesPath: packages/sie_server/bundles
    # -- Path within repo to models directory
    modelsPath: packages/sie_server/models
    # -- SSH secret for private repositories
    # Create with: kubectl create secret generic git-ssh --from-file=ssh=~/.ssh/id_rsa
    sshSecret: ""
    # -- Git-sync image
    image:
      repository: registry.k8s.io/git-sync/git-sync
      tag: v4.2.1
      pullPolicy: IfNotPresent
    # -- Resources for git-sync sidecar
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# -- Machine profiles configuration
# Machine profiles abstract cloud-specific hardware configs (GPU type + machine type + spot)
# Keys are profile names used in SDK pool creation and metrics labels
machineProfiles:
  # L4 GPU (on-demand)
  l4:
    gpuType: nvidia-l4
    machineType: g2-standard-8
    spot: false
  # L4 GPU (spot/preemptible)
  l4-spot:
    gpuType: nvidia-l4
    machineType: g2-standard-8
    spot: true
  # A100 40GB (on-demand)
  a100-40gb:
    gpuType: nvidia-tesla-a100
    machineType: a2-highgpu-1g
    spot: false
  # A100 80GB (on-demand)
  a100-80gb:
    gpuType: nvidia-a100-80gb
    machineType: a2-ultragpu-1g
    spot: false
  # CPU (no GPU, for testing)
  cpu:
    gpuType: ""
    machineType: ""
    spot: false

# -- Worker pools configuration (one StatefulSet per pool)
workers:
  # -- Common worker settings
  common:
    image:
      repository: ghcr.io/superlinked/sie-server
      tag: ""  # Defaults to appVersion
      pullPolicy: IfNotPresent

    # -- Port for SIE server
    port: 8080

    # -- Models to preload on startup (empty = lazy loading)
    preloadModels: []

    # -- Bundle to use (default)
    bundle: default

    # -- Runtime class for workers (e.g., "nvidia" to enable GPU runtime)
    runtimeClassName: ""

    # -- Model cache size limit (emptyDir - ephemeral, no zone-lock issues)
    cacheStorageSize: 300Gi

    # -- Cluster cache (S3/GCS) configuration
    clusterCache:
      enabled: false
      # -- S3/GCS bucket URL (e.g., s3://my-bucket/models or gs://my-bucket/models)
      url: ""

    # -- HuggingFace cache configuration
    hfCache:
      # -- HuggingFace home directory
      home: /models/huggingface
      # -- HuggingFace token secret name (optional)
      tokenSecret: ""
      tokenSecretKey: token

  # -- Worker pools (one StatefulSet per pool)
  # NOTE: All pools are disabled by default. Enable explicitly in your values override.
  # Each pool creates a WorkerGroup: (poolName, gpuType, bundle)
  pools:
    # L4 GPU pool (example configuration)
    l4:
      enabled: false
      # -- Minimum replicas (0 for scale-to-zero)
      minReplicas: 0
      # -- Maximum replicas
      maxReplicas: 10
      # -- Machine profile name (key from machineProfiles section)
      # Used for routing, metrics, and KEDA scaling
      machineProfile: l4
      # -- GPU type label for routing (short form used by router)
      gpuType: l4
      # -- Bundle to use (overrides common.bundle if set)
      # bundle: default
      # -- Optional runtime class override for this pool
      # runtimeClassName: "nvidia"
      # -- Node selector for GPU nodes
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      # -- GPU resource request
      gpu:
        count: 1
        # -- NVIDIA GPU product name (for node affinity)
        product: NVIDIA-L4
      # -- Resource requests/limits
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
        limits:
          cpu: "8"
          memory: "32Gi"
      # -- Tolerations for GPU nodes
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

    # A100 40GB pool (scale-to-zero)
    a100-40gb:
      enabled: false
      minReplicas: 0
      maxReplicas: 5
      machineProfile: a100-40gb
      gpuType: a100-40gb
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-a100
      gpu:
        count: 1
        product: NVIDIA-A100-SXM4-40GB
      resources:
        requests:
          cpu: "8"
          memory: "64Gi"
        limits:
          cpu: "16"
          memory: "128Gi"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

    # A100 80GB pool (scale-to-zero)
    a100-80gb:
      enabled: false
      minReplicas: 0
      maxReplicas: 3
      machineProfile: a100-80gb
      gpuType: a100-80gb
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-a100-80gb
      gpu:
        count: 1
        product: NVIDIA-A100-SXM4-80GB
      resources:
        requests:
          cpu: "8"
          memory: "128Gi"
        limits:
          cpu: "16"
          memory: "256Gi"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

    # CPU pool (for local testing with kind, no GPU required)
    cpu:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      machineProfile: cpu
      gpuType: cpu
      # No node selector - runs on any node
      nodeSelector: {}
      gpu:
        count: 0
        product: ""
      resources:
        requests:
          cpu: "2"
          memory: "6Gi"
        limits:
          cpu: "4"
          memory: "12Gi"
      tolerations: []

# -- Autoscaling configuration (requires KEDA)
autoscaling:
  # -- Enable KEDA autoscaling
  enabled: true

  # -- Prometheus server address for metrics
  prometheusAddress: http://prometheus-operated.monitoring.svc:9090

  # -- Polling interval for metrics (seconds)
  pollingInterval: 15

  # -- Cooldown period before scaling to zero (seconds)
  # GPU cold starts take 60-120s, model loading can take 5+ minutes for large models.
  # Use longer cooldown (15 min) to avoid mid-eval scale-downs.
  cooldownPeriod: 900

  # -- Scale-down stabilization window (seconds)
  scaleDownStabilization: 300

  # -- Queue depth threshold per pod
  queueDepthThreshold: 10

  # -- Queue depth to activate from zero
  queueDepthActivation: 2

  # -- Fallback replicas if Prometheus is unavailable
  fallbackReplicas: 2

# -- Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
  # -- Hostname for ingress
  host: ""
  # -- TLS configuration
  tls:
    enabled: false
    secretName: sie-tls

# -- Auth configuration (ingress-nginx + oauth2-proxy)
auth:
  enabled: false

  oauth2Proxy:
    image:
      repository: ghcr.io/oauth2-proxy/oauth2-proxy
      tag: v7.9.0
      pullPolicy: IfNotPresent

    service:
      port: 4180

    secret:
      name: oauth2-proxy
      clientIDKey: OAUTH2_PROXY_CLIENT_ID
      clientSecretKey: OAUTH2_PROXY_CLIENT_SECRET
      cookieSecretKey: OAUTH2_PROXY_COOKIE_SECRET

    oidcIssuerUrl: ""
    redirectUrl: ""
    emailDomain: "*"
    extraJwtIssuers: []
    skipJwtBearerTokens: true
    passAccessToken: true
    setAuthorizationHeader: true
    passAuthorizationHeader: true
    reverseProxy: true
    extraArgs: []
    resources: {}

  ingress:
    authResponseHeaders:
      - Authorization

# -- Service account configuration
serviceAccount:
  # -- Create service account
  create: true
  # -- Service account name (auto-generated if empty)
  name: ""
  # -- Annotations (e.g., for Workload Identity)
  annotations: {}
  # Example for GKE Workload Identity:
  # iam.gke.io/gcp-service-account: sie@my-project.iam.gserviceaccount.com

# -- RBAC configuration
rbac:
  # -- Create RBAC resources
  create: true

# -- Prometheus ServiceMonitor configuration
serviceMonitor:
  # -- Create ServiceMonitor for Prometheus Operator
  enabled: false
  # -- Labels to add to ServiceMonitor
  labels: {}
  # -- Scrape interval
  interval: 15s
  # -- Scrape timeout
  scrapeTimeout: 10s

# -- Grafana dashboard configuration
dashboards:
  # -- Create ConfigMaps for Grafana dashboard provisioning
  enabled: false
  # -- Labels for Grafana sidecar to discover dashboards
  labels:
    grafana_dashboard: "1"
  # -- Folder in Grafana to place dashboards
  folder: SIE

# -- Logging configuration
logging:
  # -- Log level (DEBUG, INFO, WARNING, ERROR)
  level: INFO
  # -- Enable structured JSON logging (required for Loki)
  json: true
