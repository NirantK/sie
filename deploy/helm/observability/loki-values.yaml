# Loki stack values for SIE log aggregation
# Install: helm install loki grafana/loki-stack -f loki-values.yaml

loki:
  # Single binary mode for simplicity (use distributed for production scale)
  deploymentMode: SingleBinary

  # Storage configuration
  storage:
    type: filesystem

  # Retention
  limits_config:
    retention_period: 168h  # 7 days

  # Schema configuration for structured logs
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Persistence
  persistence:
    enabled: true
    size: 50Gi

# Promtail is deprecated, use Grafana Alloy instead
promtail:
  enabled: false

# Test pod disabled
test:
  enabled: false
