# GLiNER bundle: NER and relation extraction models
# Note: GLiNER 0.2.25+ is compatible with transformers>=4.57 (upstream fix)
# GLiREL depends on GLiNER transitively, so it must be in the same bundle.
[bundle]
name = "gliner"
priority = 25  # Lower = preferred. Router selects lowest priority compatible bundle.
default = false
models = [
    # NER / extraction models (GLiNER family)
    "urchade/gliner_small-v2.1",       # English NER, 50M params
    "urchade/gliner_medium-v2.1",      # English NER, 100M params
    "urchade/gliner_large-v2.1",       # English NER, 304M params
    "urchade/gliner_multi_pii-v1",     # Multilingual PII detection
    "urchade/gliner_multi-v2.1",       # Multilingual NER, 209M params
    "EmergentMethods/gliner_large_news-v2.1",  # News domain NER
    "Ihor/gliner-biomed-large-v1.0",   # Biomedical NER
    "numind/NuNER_Zero",               # Zero-shot NER
    "numind/NuNER_Zero-span",          # Zero-shot NER with span
    # Relation extraction (GLiREL) — depends on gliner transitively
    "jackboyla/glirel-large-v0",       # Relation extraction, 400M params
    # Classification (GLiClass)
    "knowledgator/gliclass-small-v1.0",
    "knowledgator/gliclass-base-v1.0",
]

[bundle.deps]
gliner = ">=0.2,<1"
glirel = ">=1.0,<2"
gliclass = ">=0.1,<1"
loguru = ">=0.7,<1"  # Required by glirel
