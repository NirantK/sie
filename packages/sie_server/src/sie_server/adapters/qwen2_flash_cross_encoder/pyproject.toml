# Dependencies for Qwen2 Flash Cross-Encoder adapter
# Uses Qwen2's native flash_attention_2 for causal LM rerankers

[project]
name = "sie-adapter-qwen2-flash-cross-encoder"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "transformers>=4.45",
    # Pin torch to match base env — flash-attn's unpinned torch dep can pull in 2.10+ which breaks torchvision
    "torch>=2.9,<2.10",
    # Flash Attention 2 - required for flash_attention_2 attn_implementation
    # Pre-built wheels from: https://github.com/mjun0812/flash-attention-prebuild-wheels
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.0/flash_attn-2.7.4+cu128torch2.9-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux'",
]
