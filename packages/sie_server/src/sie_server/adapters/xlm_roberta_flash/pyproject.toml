[project]
name = "sie-adapter-xlm-roberta-flash"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "transformers>=4.45",
    "huggingface-hub>=0.20",
    # Pin torch to match base env — flash-attn's unpinned torch dep can pull in 2.10+ which breaks torchvision
    "torch>=2.9,<2.10",
    # Prebuilt wheel for torch 2.9 + CUDA 12.8 + Python 3.12
    # See https://github.com/mjun0812/flash-attention-prebuild-wheels for other versions
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.0/flash_attn-2.7.4+cu128torch2.9-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux'",
]
