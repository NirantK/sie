# Dependencies for ColPali adapter
# Uses flash attention 2 when available (falls back to SDPA)

[project]
name = "sie-adapter-colpali"
version = "0.1.0"
description = "ColPali adapter for SIE - visual document retrieval with Flash Attention 2"
requires-python = ">=3.12"

dependencies = [
    # Pin torch to match the base env version range — prevents the overlay
    # from pulling in torch 2.10+ (which breaks torchvision for VLM models).
    "torch>=2.9,<2.10",
    # Flash Attention 2.7.4 prebuilt for CUDA 12.8 + torch 2.9
    # See https://github.com/mjun0812/flash-attention-prebuild-wheels for other versions
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.0/flash_attn-2.7.4+cu128torch2.9-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux'",
]
