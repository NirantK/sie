<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#888"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-weight="700" font-size="16" fill="#333">Retrieval + Reranking</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#999">Retrieve candidates with embeddings, rerank with cross-encoder</text>

  <!-- Product -->
  <rect x="20" y="80" width="120" height="52" rx="8" fill="#E8E8E8" stroke="#AAA" stroke-width="1.5"/>
  <text x="80" y="101" text-anchor="middle" font-weight="600" font-size="12" fill="#333">Product</text>
  <text x="80" y="118" text-anchor="middle" font-size="9" fill="#666">title (+ image)</text>

  <!-- Arrow -->
  <line x1="140" y1="106" x2="168" y2="106" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 1: Retrieval -->
  <rect x="172" y="72" width="170" height="68" rx="8" fill="#FE8019" stroke="#D96A0B" stroke-width="1.5"/>
  <text x="257" y="94" text-anchor="middle" font-weight="700" font-size="12" fill="#fff">Stage 1: Retrieve</text>
  <text x="257" y="112" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">SIE — encode()</text>
  <text x="257" y="128" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">best embedding model + kNN</text>

  <!-- Arrow with label -->
  <line x1="342" y1="106" x2="388" y2="106" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="365" y="98" text-anchor="middle" font-size="9" fill="#999">top-K</text>

  <!-- Stage 2: Rerank -->
  <rect x="392" y="72" width="170" height="68" rx="8" fill="#FE8019" stroke="#D96A0B" stroke-width="1.5"/>
  <text x="477" y="94" text-anchor="middle" font-weight="700" font-size="12" fill="#fff">Stage 2: Rerank</text>
  <text x="477" y="112" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">SIE — score()</text>
  <text x="477" y="128" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">cross-encoder reranker</text>

  <!-- Arrow -->
  <line x1="562" y1="106" x2="608" y2="106" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Result -->
  <rect x="612" y="80" width="186" height="52" rx="8" fill="#E8E8E8" stroke="#AAA" stroke-width="1.5"/>
  <text x="705" y="101" text-anchor="middle" font-weight="600" font-size="11" fill="#333">Reranked Predictions</text>
  <text x="705" y="118" text-anchor="middle" font-size="9" fill="#666">top-K with cross-encoder scores</text>

  <!-- Annotation -->
  <line x1="20" y1="170" x2="800" y2="170" stroke="#E0E0E0" stroke-width="1"/>
  <text x="410" y="186" text-anchor="middle" font-size="10" fill="#999">Builds on top of the best retrieval approach. Both stages served by the same SIE instance.</text>
  <text x="410" y="200" text-anchor="middle" font-size="10" fill="#999">Tests whether pairwise scoring on a small candidate set improves over retrieval alone.</text>
</svg>
