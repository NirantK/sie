<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#888"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-weight="700" font-size="16" fill="#333">Multi-Modal Retrieval</text>
  <text x="410" y="46" text-anchor="middle" font-size="11" fill="#999">Combine text and image signals for category prediction</text>

  <!-- ===== TEXT PATH ===== -->

  <text x="20" y="82" font-size="10" font-weight="600" fill="#555">TEXT</text>

  <rect x="20" y="92" width="150" height="44" rx="8" fill="#E8E8E8" stroke="#AAA" stroke-width="1.5"/>
  <text x="95" y="110" text-anchor="middle" font-weight="600" font-size="11" fill="#333">Product Title</text>
  <text x="95" y="124" text-anchor="middle" font-size="9" fill="#666">"ThinkPad X1 Carbon"</text>

  <line x1="170" y1="114" x2="218" y2="114" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="222" y="92" width="170" height="44" rx="8" fill="#FE8019" stroke="#D96A0B" stroke-width="1.5"/>
  <text x="307" y="110" text-anchor="middle" font-weight="700" font-size="12" fill="#fff">SIE — encode()</text>
  <text x="307" y="124" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)">text embedding model</text>

  <line x1="392" y1="114" x2="438" y2="114" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="442" y="92" width="140" height="44" rx="8" fill="#F3F3F3" stroke="#BBB" stroke-width="1.5"/>
  <text x="512" y="110" text-anchor="middle" font-weight="600" font-size="11" fill="#333">Text kNN</text>
  <text x="512" y="124" text-anchor="middle" font-size="9" fill="#666">top-K candidates</text>

  <!-- ===== IMAGE PATH ===== -->

  <text x="20" y="172" font-size="10" font-weight="600" fill="#555">IMAGE</text>

  <rect x="20" y="182" width="150" height="44" rx="8" fill="#E8E8E8" stroke="#AAA" stroke-width="1.5"/>
  <rect x="34" y="190" width="28" height="28" rx="4" fill="#D0D0D0" stroke="#BBB" stroke-width="1"/>
  <text x="48" y="208" text-anchor="middle" font-size="14" fill="#999">🖼</text>
  <text x="112" y="203" text-anchor="middle" font-weight="600" font-size="11" fill="#333">Product</text>
  <text x="112" y="217" text-anchor="middle" font-size="9" fill="#666">Image</text>

  <line x1="170" y1="204" x2="218" y2="204" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="222" y="182" width="170" height="44" rx="8" fill="#FE8019" stroke="#D96A0B" stroke-width="1.5"/>
  <text x="307" y="200" text-anchor="middle" font-weight="700" font-size="12" fill="#fff">SIE — encode()</text>
  <text x="307" y="214" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)">vision model</text>

  <line x1="392" y1="204" x2="438" y2="204" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="442" y="182" width="140" height="44" rx="8" fill="#F3F3F3" stroke="#BBB" stroke-width="1.5"/>
  <text x="512" y="200" text-anchor="middle" font-weight="600" font-size="11" fill="#333">Image kNN</text>
  <text x="512" y="214" text-anchor="middle" font-size="9" fill="#666">top-K candidates</text>

  <!-- ===== MERGE ===== -->

  <!-- Lines from both kNN boxes to merge -->
  <line x1="582" y1="114" x2="620" y2="155" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="582" y1="204" x2="620" y2="163" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Merge box -->
  <rect x="624" y="140" width="80" height="40" rx="8" fill="#F3F3F3" stroke="#BBB" stroke-width="1.5"/>
  <text x="664" y="164" text-anchor="middle" font-weight="600" font-size="11" fill="#333">Merge</text>

  <!-- Arrow to result -->
  <line x1="704" y1="160" x2="728" y2="160" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Result -->
  <rect x="732" y="134" width="72" height="52" rx="8" fill="#E8E8E8" stroke="#AAA" stroke-width="1.5"/>
  <text x="768" y="156" text-anchor="middle" font-weight="600" font-size="10" fill="#333">Final</text>
  <text x="768" y="170" text-anchor="middle" font-size="10" fill="#333">top-K</text>

  <!-- Annotation -->
  <line x1="20" y1="252" x2="800" y2="252" stroke="#E0E0E0" stroke-width="1"/>
  <text x="410" y="268" text-anchor="middle" font-size="10" fill="#999">Run text and image retrieval independently, combine candidate sets. Both paths served by the same SIE instance.</text>
</svg>
